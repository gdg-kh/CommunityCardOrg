name: Issue to Event PR

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-event-pr:
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'add-event') &&
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'add-event'
      )
    runs-on: ubuntu-latest
    steps:
      - name: 驗證操作者是否具備寫入權限
        id: auth
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.sender.login,
            });
            const authorized = ["admin", "maintain", "write"].includes(data.permission);
            core.setOutput("authorized", authorized ? "true" : "false");
            if (!authorized) {
              const msg = `操作者 @${context.payload.sender.login} 權限不足（${data.permission}），已攔截執行。`;
              if (context.payload.action === "labeled") {
                core.setFailed(msg);
              } else {
                core.info(msg);
              }
            }

      - uses: actions/checkout@v4
        if: steps.auth.outputs.authorized == 'true'

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.authorized == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: 自動讀取網頁、AI 提取欄位並寫入 events.json
        id: add_event
        if: steps.auth.outputs.authorized == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          OUTPUT=$(node scripts/add-event.mjs 2>&1)
          CODE=$?
          echo "$OUTPUT"
          DELIM="gh_out_$(openssl rand -hex 12)"
          echo "result<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE
        continue-on-error: true

      - name: 若驗證或解析失敗則於 Issue 留言提示原因
        if: steps.auth.outputs.authorized == 'true' && steps.add_event.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          ERROR_MSG: ${{ steps.add_event.outputs.result }}
        with:
          script: |
            const msg = process.env.ERROR_MSG || "";
            const maxTicks = Math.max(3, ...[...msg.matchAll(/`+/g)].map((m) => m[0].length + 1));
            const fence = "`".repeat(maxTicks);
            let authorCanWrite = false;
            try {
              const { data: authorPerm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.issue.user.login,
              });
              authorCanWrite = ["admin", "maintain", "write"].includes(authorPerm.permission);
            } catch {
              authorCanWrite = false;
            }
            const retryHint = authorCanWrite
              ? "請直接點選此 Issue 右上角的「Edit」補充或修正內容，儲存後系統會自動重新執行。"
              : "請點選此 Issue 右上角的「Edit」補充或修正內容後，通知維護者移除並重新加上 `add-event` 標籤以重新觸發執行。";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### ⚠️ 活動自動解析或驗證未通過\n\n${fence}\n${msg}\n${fence}\n\n${retryHint}`
            });
            core.setFailed(msg);

      - name: 執行資料一致性檢查 (check-data.mjs)
        if: steps.auth.outputs.authorized == 'true'
        env:
          ADDED_YEAR: ${{ steps.add_event.outputs.added_year }}
        run: |
          if [ "$ADDED_YEAR" = "2026" ]; then
            node scripts/check-data.mjs 2026 --events-structure
          else
            node scripts/check-data.mjs "${ADDED_YEAR:-2027}"
          fi

      - name: 建立分支並發起 Pull Request
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/github-script@v7
        env:
          SUCCESS_MSG: ${{ steps.add_event.outputs.result }}
          ADDED_YEAR: ${{ steps.add_event.outputs.added_year }}
        with:
          script: |
            const { execSync } = require("child_process");
            const issueNumber = context.issue.number;
            const branchName = `event/issue-${issueNumber}`;

            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync(`git checkout -B ${branchName}`);
            execSync("git add 2026/events.json 2027/events.json");
            try {
              execSync("git diff --cached --quiet");
              console.log("工作區無新增變更，略過建立提交。");
              return;
            } catch {
              // exit 1 表示有 staged 變更，繼續 commit 與建立 PR
            }
            execSync(`git commit -m "chore(events): add event from issue #${issueNumber}"`);
            execSync(`git push -f origin ${branchName}`);

            const { data: existingPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: "open",
            });

            const rawIssueTitle = (context.payload.issue.title || "").trim();
            const prTitle = (!rawIssueTitle || rawIssueTitle === "[新增活動]")
              ? `[新增活動] Issue #${issueNumber}`
              : rawIssueTitle;

            let prUrl;
            if (existingPrs.length > 0) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: existingPrs[0].number,
                title: prTitle,
                body: `${process.env.SUCCESS_MSG}\n\nCloses #${issueNumber}`,
              });
              prUrl = existingPrs[0].html_url;
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: branchName,
                base: "main",
                body: `${process.env.SUCCESS_MSG}\n\nCloses #${issueNumber}`,
              });
              prUrl = pr.html_url;
            }

            const targetYear = process.env.ADDED_YEAR || "2027";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `${process.env.SUCCESS_MSG}\n\n➡️ 已自動建立（或更新）Pull Request（更新 \`${targetYear}/events.json\`）：${prUrl}\n待管理員審核 Merge 後即會自動上線（月曆 OG 縮圖將於部署時自動更新）。`,
            });
