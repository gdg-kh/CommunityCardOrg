name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Generate current-month OG image
        run: |
          npm ci
          npx puppeteer browsers install chrome
          node scripts/generate-og-images.js
          CURRENT_YM=$(TZ=Asia/Taipei date +%Y-%m)
          if [[ "$CURRENT_YM" == 2026-* ]]; then
            OG_TARGET_DATE="$CURRENT_YM" node scripts/generate-og-images.js
          fi
      - name: Inject UTM tracking into events.json / data.json
        run: node scripts/add-tracking.mjs
      - name: Strip node_modules before upload
        run: rm -rf node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
