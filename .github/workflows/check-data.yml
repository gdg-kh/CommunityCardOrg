name: Check community data

on:
  pull_request:
    paths:
      - "2026/calendar.html"
      - "2026/data.json"
      - "2026/events.json"
      - "2027/data.json"
      - "2027/events.json"
      - "2027/stamps.json"
      - "2027/manifest.webmanifest"
      - "2027/sw.js"
      - "2027/calendar-modes.css"
      - "2027/*.html"
      - "2027/passport/**"
      - "assets/**"
      - "scripts/**"
      - "mcp/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/check-data.yml"
  push:
    branches: [main]
    paths:
      - "2026/calendar.html"
      - "2026/data.json"
      - "2026/events.json"
      - "2027/data.json"
      - "2027/events.json"
      - "2027/stamps.json"
      - "2027/manifest.webmanifest"
      - "2027/sw.js"
      - "2027/calendar-modes.css"
      - "2027/*.html"
      - "2027/passport/**"
      - "assets/**"
      - "scripts/**"
      - "mcp/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/check-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 檢查 2027 社群名稱與簽到設定是否一致
        run: node scripts/check-data.mjs 2027
      - name: 檢查 2026 活動資料結構
        run: node scripts/check-data.mjs 2026 --events-structure
      - name: 檢查 PWA 與離線支援規格
        run: node scripts/check-pwa.mjs
      - name: 執行單元測試
        run: npm run test:unit
      - name: 執行 MCP 驗證測試
        run: npm run test:mcp
