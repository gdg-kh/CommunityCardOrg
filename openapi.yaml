openapi: 3.1.0
info:
  title: Kaohsiung Community API
  description: 提供高雄在地技術社群的介紹與活動行事曆資料。
  version: 1.0.0
servers:
  - url: https://your-github-pages-url.github.io/CommunityCardOrg
    description: GitHub Pages Production Server（fork 後請改為自己的網址，例如 https://community-card.org）

paths:
  /2026/data.json:
    get:
      summary: 取得社群清單與介紹
      description: 回傳 2026 年參與的高雄技術社群清單、贊助商與集點獎勵資訊。
      operationId: getCommunities
      responses:
        '200':
          description: 成功取得資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityData'

  /2026/events.json:
    get:
      summary: 取得 2026 活動行事曆（扁平格式）
      description: 回傳 2026 年各社群舉辦的活動清單。
      operationId: getEvents2026
      responses:
        '200':
          description: 成功取得活動資料
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /2027/data.json:
    get:
      summary: 取得 2027 社群清單與介紹
      description: 回傳 2027 年參與的高雄技術社群清單、贊助商與集點獎勵資訊。
      operationId: getCommunities2027
      responses:
        '200':
          description: 成功取得資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityData'

  /2027/stamps.json:
    get:
      summary: 取得 2027 數位集章與公鑰設定
      description: 回傳 2027 年各社群數位集章樣式、兌換門檻、合作社群與簽到驗證公鑰設定。
      operationId: getStamps2027
      responses:
        '200':
          description: 成功取得集章設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StampsData'

  /2027/events.json:
    get:
      summary: 取得 2027 活動行事曆（社群分組格式）
      description: 回傳 2027 年依社群分組的活動清單。
      operationId: getEvents2027
      responses:
        '200':
          description: 成功取得活動資料
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityEventGroup'

components:
  schemas:
    CommunityData:
      type: object
      properties:
        communities:
          type: array
          items:
            $ref: '#/components/schemas/Community'
        sponsors:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/Entity'

    Entity:
      type: object
      properties:
        name:
          type: string
        link:
          type: string
          format: uri
        logo:
          type: string
        description:
          type: string

    Community:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            color:
              type: string
              description: 該社群代表色的 Hex 色碼，例如 #EA4335

    Event:
      type: object
      required:
        - date
        - title
        - community
        - color
      properties:
        date:
          type: string
          format: date
          description: 活動日期 (YYYY-MM-DD)
        community:
          type: string
          description: 主辦社群名稱
        title:
          type: string
          description: 活動標題
        description:
          type: string
          maxLength: 50
          description: 活動介紹 (不超過 50 個字)
        link:
          type: string
          description: 活動報名或宣傳連結
        color:
          type: string
          description: 顯示在行事曆上的顏色，需對應該社群的代表色
        mode:
          type: string
          enum: [onsite, online, hybrid]
          default: onsite
          description: 活動形式（onsite 現場、online 線上、hybrid 混合，未填時預設為 onsite）

    CommunityEventGroup:
      type: object
      required:
        - community
        - color
        - events
      properties:
        community:
          type: string
          description: 主辦社群名稱
        color:
          type: string
          description: 該社群代表色的 Hex 色碼，例如 #EA4335
        mode:
          type: string
          enum: [onsite, online, hybrid]
          description: 該社群的預設活動形式（選填）
        events:
          type: array
          items:
            type: object
            required:
              - date
              - title
              - link
            properties:
              date:
                type: string
                format: date
                description: 活動日期 (YYYY-MM-DD)
              title:
                type: string
                description: 活動標題
              description:
                type: string
                maxLength: 50
                description: 活動介紹 (不超過 50 個字)
              link:
                type: string
                description: 活動報名或宣傳連結
              mode:
                type: string
                enum: [onsite, online, hybrid]
                default: onsite
                description: 單場活動形式（未填時繼承外層或預設為 onsite）

    StampsData:
      type: object
      required:
        - communities
      properties:
        communities:
          type: array
          items:
            $ref: '#/components/schemas/StampCommunity'
        partners:
          type: array
          items:
            $ref: '#/components/schemas/StampCommunity'

    StampCommunity:
      type: object
      required:
        - id
        - name
        - publicKeys
      properties:
        id:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: 簽到碼與網址使用的社群代號
        name:
          type: string
          description: 社群名稱（需與 data.json 一致）
        short:
          type: string
          description: 印章簡稱（選填）
        color:
          type: string
          description: 合作社群代表色 Hex 色碼（partners 選填）
        stamp:
          $ref: '#/components/schemas/StampConfig'
        reward:
          $ref: '#/components/schemas/StampReward'
        publicKeys:
          type: array
          items:
            $ref: '#/components/schemas/PublicKeyEntry'

    StampVariant:
      type: object
      required:
        - variant
      properties:
        variant:
          type: string
          enum: [color, grayscale, tint, image]
        src:
          type: string
          description: variant 為 image 時指定圖檔路徑
        color:
          type: string
          description: variant 為 tint 時指定色碼 (#RRGGBB)

    StampConfig:
      type: object
      properties:
        image:
          type: string
          description: 印章底圖路徑
        mode:
          type: string
          enum: [distinct, shared]
          default: shared
        onsite:
          $ref: '#/components/schemas/StampVariant'
        online:
          $ref: '#/components/schemas/StampVariant'
        shared:
          $ref: '#/components/schemas/StampVariant'

    StampReward:
      type: object
      required:
        - scope
        - required
        - text
      properties:
        scope:
          type: string
          enum: [community, others, all]
        required:
          type: integer
          minimum: 1
        text:
          type: string

    PublicKeyEntry:
      type: object
      required:
        - kid
        - jwk
      properties:
        kid:
          type: string
        jwk:
          type: object
          required:
            - kty
            - crv
            - x
            - y
          properties:
            kty:
              type: string
              enum: [EC]
            crv:
              type: string
              enum: [P-256]
            x:
              type: string
            y:
              type: string
        revokedAt:
          type: string
          format: date-time
