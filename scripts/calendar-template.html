<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>{{YEAR}} 年 {{MONTH}} 月高雄社群活動月曆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background: #ffffff;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 6px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .og-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            padding: 2px 4px 4px 4px;
            display: flex;
            flex-direction: column;
        }

        .og-header {
            text-align: center;
            margin-bottom: 6px;
        }

        .og-title {
            font-size: 26px;
            font-weight: 700;
            color: #222;
            line-height: 1.2;
        }

        .calendar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            overflow: hidden;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f1f5f9;
            border-bottom: 1px solid #d0d5dd;
            text-align: center;
            font-weight: 700;
            padding: 6px 0;
            font-size: 16px;
            color: #334155;
        }

        .calendar-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr;
            gap: 1px;
            background: #dfe3e8;
            overflow: hidden;
        }

        .calendar-day {
            background: #ffffff;
            padding: 6px 6px 2px 6px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
        }

        .calendar-day.empty {
            background: #fafafa;
        }

        /* Weekend borders */
        .calendar-day.saturday {
            border-left: 2px solid #f28b82;
            border-right: 2px solid #f28b82;
            border-bottom: 2px solid #f28b82;
        }

        .calendar-day.sunday {
            border-left: 2px solid #f28b82;
            border-right: 2px solid #f28b82;
            border-bottom: 2px solid #f28b82;
        }

        /* Add top border only when needed */
        .calendar-day.saturday.weekend-top,
        .calendar-day.sunday.weekend-top {
            border-top: 2px solid #f28b82;
        }

        /* Remove duplicate border between Saturday and Sunday */
        .calendar-day.saturday + .calendar-day.sunday {
            border-left: none;
        }

        /* National holidays - same red border as weekends */
        .calendar-day.holiday {
            border-left: 2px solid #f28b82;
            border-right: 2px solid #f28b82;
            border-bottom: 2px solid #f28b82;
        }

        .calendar-day.holiday.holiday-top {
            border-top: 2px solid #f28b82;
        }

        /* Remove duplicate border between adjacent holidays */
        .calendar-day.holiday + .calendar-day.holiday {
            border-left: none;
        }

        /* Remove right border on holiday when adjacent to Saturday (avoid double border) */
        .calendar-day.holiday:has(+ .calendar-day.saturday) {
            border-right: none;
        }

        .date-col {
            width: 24px;
            flex-shrink: 0;
            margin-right: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .date-number {
            font-size: 15px;
            font-weight: 700;
            color: #222;
            line-height: 1.15;
            text-align: center;
        }

        .holiday-label {
            font-size: 11px;
            color: #e53e3e;
            font-weight: 700;
            line-height: 1.15;
            margin-top: 2px;
            text-align: center;
            word-break: break-all;
        }

        .events-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .day-event {
            font-size: 13.5px;
            line-height: 1.26;
            border-left: 3.5px solid #0d6efd;
            padding-left: 5px;
            margin-bottom: 4px;
            overflow: hidden;
        }

        .event-community {
            font-weight: 700;
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-name {
            color: #222;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="og-container">
        <div class="og-header">
            <div class="og-title">{{YEAR}} 年 {{MONTH}} 月高雄社群活動</div>
        </div>

        <div class="calendar-wrapper">
            <div class="calendar-header">
                <div>週一</div>
                <div>週二</div>
                <div>週三</div>
                <div>週四</div>
                <div>週五</div>
                <div>週六</div>
                <div>週日</div>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- JavaScript will inject calendar cells here -->
            </div>
        </div>
    </div>

    <script>
        const year = {{YEAR}};
        const month = {{MONTH}};
        const events = {{EVENTS_JSON}};
        const holidays = {{HOLIDAYS_JSON}};
        const holidayMap = new Map(holidays.map(h => [h.date, h.name]));

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const firstDay = new Date(year, month - 1, 1);
            let startDay = firstDay.getDay();
            startDay = (startDay === 0) ? 6 : startDay - 1;

            const daysInMonth = new Date(year, month, 0).getDate();
            let html = '';

            for (let i = 0; i < startDay; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const currentDateObj = new Date(year, month - 1, day);
                const dayOfWeek = currentDateObj.getDay();
                const isSaturday = (dayOfWeek === 6);
                const isSunday = (dayOfWeek === 0);
                const isWeekend = isSaturday || isSunday;

                let needTopBorder = false;
                if (isWeekend) {
                    if (day <= 7) {
                        needTopBorder = true;
                    } else {
                        const prevWeekDay = day - 7;
                        const prevWeekDate = new Date(year, month - 1, prevWeekDay);
                        const prevWeekDayOfWeek = prevWeekDate.getDay();
                        const prevWeekIsWeekend = (prevWeekDayOfWeek === 0 || prevWeekDayOfWeek === 6);
                        needTopBorder = !prevWeekIsWeekend;
                    }
                }

                const weekendClass = isSaturday ? ' saturday' : (isSunday ? ' sunday' : '');
                const topBorderClass = needTopBorder ? ' weekend-top' : '';
                const holidayName = !isWeekend ? holidayMap.get(dateStr) : undefined;
                const isHoliday = !!holidayName;
                let holidayClass = '';
                if (isHoliday) {
                    let needHolidayTop;
                    if (day <= 7) {
                        needHolidayTop = true;
                    } else {
                        const prevDateStr = `${year}-${String(month).padStart(2, '0')}-${String(day - 7).padStart(2, '0')}`;
                        needHolidayTop = !holidayMap.has(prevDateStr);
                    }
                    holidayClass = ' holiday' + (needHolidayTop ? ' holiday-top' : '');
                }

                const dayEvents = events.filter(e => e.date === dateStr);

                html += `<div class="calendar-day${weekendClass}${topBorderClass}${holidayClass}">
                    <div class="date-col">
                        <span class="date-number">${day}</span>
                        ${isHoliday ? `<span class="holiday-label">${holidayName}</span>` : ''}
                    </div>
                    <div class="events-container">`;

                const showCommunityOnly = dayEvents.length >= 3;

                dayEvents.forEach(event => {
                    const colorStyle = event.color ? `color: ${event.color};` : '';
                    const borderStyle = event.color ? `border-left-color: ${event.color};` : '';
                    const hasTitle = event.title && event.title.trim();

                    html += `<div class="day-event" style="${borderStyle}">
                        <div class="event-community" style="${colorStyle}">${event.community}</div>
                        ${(!showCommunityOnly && hasTitle) ? `<div class="event-name">${event.title}</div>` : ''}
                    </div>`;
                });

                html += '</div></div>';
            }

            const totalCells = startDay + daysInMonth;
            const remaining = 7 - (totalCells % 7);
            if (remaining < 7) {
                for (let i = 0; i < remaining; i++) {
                    html += '<div class="calendar-day empty"></div>';
                }
            }

            grid.innerHTML = html;
        }

        renderCalendar();
    </script>
</body>
</html>
